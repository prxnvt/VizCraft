[package]
name = "protocraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ProtoCraft egui front end (title bar, menus, ribbon, panes, status bar, dialogs, control); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
protocraft-engine = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# PNG encoding for `ui.screenshot` (the control channel writes window captures to disk).
image = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
