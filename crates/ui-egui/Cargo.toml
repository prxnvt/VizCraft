[package]
name = "vizcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VizCraft egui front end (title bar, menus, ribbon, panes, status bar, dialogs, control); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
vizcraft-engine = { workspace = true }
# The canvas draws and hit-tests the model directly; the Shapes pane lists the catalog.
vizcraft-diagram = { workspace = true }
vizcraft-stencils = { workspace = true }
# The Process tab reads the conformance profile in effect and lists the rulesets of the catalog.
vizcraft-notation = { workspace = true }
# The Analyze ribbon, canvas highlights and Analysis dock read `Session.analysis` as typed results.
vizcraft-analysis = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# PNG encoding for `ui.screenshot` (the control channel writes window captures to disk).
image = { workspace = true }

# The browser has no `SystemTime`; `web_time` is the same API over `performance.now()`, so
# status messages fade and screenshots time out there too.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
