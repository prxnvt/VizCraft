[package]
name = "vizcraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "vizcraft"
description = "VizCraft desktop app"

[lints]
workspace = true

[dependencies]
vizcraft-engine = { workspace = true }
vizcraft-ui-egui = { workspace = true }
vizcraft-notation = { workspace = true }
vizcraft-macos-open = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for vizcraft.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
# Resident memory for the performance trace (MIT OR Apache-2.0).
memory-stats = "1.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
