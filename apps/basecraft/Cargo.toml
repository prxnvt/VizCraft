[package]
name = "basecraft"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "basecraft"
description = "BaseCraft desktop app"

[lints]
workspace = true

[dependencies]
basecraft-engine = { workspace = true }
basecraft-ui-egui = { workspace = true }
basecraft-macos-open = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
