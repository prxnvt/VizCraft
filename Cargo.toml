[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/vizcraft", "apps/vizcraft-cli", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/storytold/vizcraft"

[workspace.dependencies]
# internal
vizcraft-engine = { path = "crates/engine" }
vizcraft-ui-egui = { path = "crates/ui-egui" }
vizcraft-macos-open = { path = "crates/macos-open" }
vizcraft-mcp = { path = "crates/mcp" }
vizcraft-diagram = { path = "crates/diagram" }
vizcraft-stencils = { path = "crates/stencils" }
vizcraft-formats = { path = "crates/formats" }
vizcraft-drawio = { path = "crates/drawio" }
vizcraft-mermaid = { path = "crates/mermaid" }
vizcraft-layout = { path = "crates/layout" }
vizcraft-routing = { path = "crates/routing" }
vizcraft-model = { path = "crates/model" }
vizcraft-notation = { path = "crates/notation" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
toml = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Text only, no system fonts or raster images, so it reads nothing from the machine and builds for wasm.
resvg = { version = "0.47", default-features = false, features = ["text"] }

# Table reading for data links: CSV (MIT or Unlicense) and XLSX workbooks (MIT, pure Rust, kept
# out of the web build).
csv = "1.4"
calamine = { version = "0.36", default-features = false }

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
opt-level = 3
debug = 1
